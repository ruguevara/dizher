<title>Dizher Eye Rounds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* A dark viewing room: the pictures sit on a black surround (fixed by the protocol), the controls in one quiet bar. */
:root {
  --surround: #000000;
  --bar: #101113;
  --line: #24262b;
  --fg: #c9ccd2;
  --dim: #7d828c;
  --accent: #e8c547;      /* the ZX bright yellow, used only for the current choice and the progress */
  --warn: #ff6b5e;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--surround); color: var(--fg); font-family: var(--mono); font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 8px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
header h1 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin: 0; color: var(--fg); }
select, button {
  font: inherit; color: var(--fg); background: #18191c; border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px;
}
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.meta { color: var(--dim); font-variant-numeric: tabular-nums; }
.progress { color: var(--accent); font-variant-numeric: tabular-nums; }
.keys { color: var(--dim); }
.keys b { color: var(--fg); font-weight: 600; }
main { padding-block: 20px 40px; }
.notice { max-width: 64ch; line-height: 1.6; color: var(--fg); padding-block: 24px; }
.notice.warn { color: var(--warn); }
.stage { display: flex; gap: 24px; align-items: flex-start; }
.grid { display: grid; grid-template-columns: auto auto; gap: 16px 16px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
figcaption { color: var(--dim); font-size: 12px; letter-spacing: .04em; }
figure.on figcaption { color: var(--accent); }
img.px { display: block; image-rendering: pixelated; image-rendering: crisp-edges; max-width: none; cursor: pointer; }
figure.ref img.px { cursor: default; }
.done { color: var(--accent); }
.warn { color: var(--warn); }
@media (prefers-reduced-motion: no-preference) { figure.flash img.px { transition: opacity .08s; } }
</style>

<header>
  <h1>Dizher eye rounds</h1>
  <label class="meta" for="round">Round</label>
  <select id="round" aria-label="Round"></select>
  <span class="progress" id="progress"></span>
  <span class="meta" id="saving" aria-live="polite"></span>
  <button id="mode" type="button" title="Tab switches the layout">Grid</button>
  <span class="meta" id="pixels"></span>
  <span class="keys" id="keys"></span>
</header>
<main>
  <div class="notice" id="notice">Loading the rounds…</div>
  <div class="stage" id="stage" hidden></div>
</main>

<script>
// Rounds live in the db (`rounds/<id>`, written by the research session); each answer is one document
// `votes/<round>__<item>`. Images are files published beside the page. Nothing here reveals which method made
// which picture: the options come shuffled under random names, and the key stays with the session.
const $ = (id) => document.getElementById(id);
const state = { db: null, rounds: {}, votes: {}, roundId: null, mode: 'grid', index: 0, shown: 1, flips: 0, t0: 0,
  pending: 0, failed: 0, writes: {} };

function zoomFor(round) {
  const z = round.zoom || {};
  if (round.task === 'mark') return z.mark || 3;
  return state.mode === 'flip' ? (z.flip || 3) : (z.grid || 2);
}

function pixelCheck(round) {
  const dpr = window.devicePixelRatio || 1, z = zoomFor(round);
  const device = z * dpr, exact = Math.abs(device - Math.round(device)) < 1e-6;
  const need = round.task === 'mark' || state.mode === 'flip' ? 2 * 256 * z + 24 : 3 * 256 * z + 24 + 16;
  const wide = document.documentElement.clientWidth - 32 >= need;
  $('pixels').textContent = `x${z} · ${round.w || 256}x${round.h || 192} · ${Math.round(device * 100) / 100} device px a pixel`;
  return { exact, wide, need, dpr };
}

function currentRound() { return state.rounds[state.roundId]; }
function itemsLeft(round) { return round.items.filter((it) => !state.votes[`${round.id}__${it.id}`]); }

function render() {
  const round = currentRound(), stage = $('stage'), notice = $('notice');
  if (!round) { stage.hidden = true; notice.hidden = false; notice.textContent = 'No open round yet. The next batch appears here as soon as it is published.'; return; }
  const answered = round.items.length - itemsLeft(round).length;
  $('progress').textContent = `${answered} / ${round.items.length}`;
  $('mode').textContent = state.mode === 'grid' ? 'Grid' : 'Flip';
  $('keys').innerHTML = round.task === 'mark'
    ? '<b>3</b> seams along the grid · <b>1</b> cells: added (blocks, noise, contours) · <b>2</b> cells: lost or wrong · <b>right/Shift</b> erase · <b>Space</b> hold for the original · <b>Enter</b> done · <b>Backspace</b> back'
    : state.mode === 'grid'
    ? '<b>1-4</b> pick · <b>0</b> none better · <b>Backspace</b> back · <b>Tab</b> flip view'
    : '<b>1-4</b> show · <b>Enter</b> pick shown · <b>0</b> none better · <b>Backspace</b> back · <b>Tab</b> grid view';
  const check = pixelCheck(round);
  if (!check.exact) { return block(`The browser's zoom makes the pixels uneven (${check.dpr} device pixels per CSS pixel). Set the browser zoom to 100% (Cmd/Ctrl+0) and keep the display scaling as in the emulator.`); }
  if (!check.wide) { return block(`This layout needs ${check.need} px of width; the window has ${document.documentElement.clientWidth}. Open the page full width (its own tab) or press Tab for the narrower view.`); }
  const item = round.items[state.index];
  if (!item) { stage.hidden = true; notice.hidden = false; notice.className = 'notice done'; notice.textContent = `Round done: ${answered} answers saved. Backspace goes back to the last one.`; return; }
  const saved = state.votes[`${round.id}__${item.id}`];
  $('progress').textContent += saved ? ` · answered ${saved.cells ? 'marked' : saved.pick || 'none'}, a new answer replaces it` : '';
  notice.hidden = true; notice.className = 'notice'; stage.hidden = false;
  if (round.task === 'mark') { renderMark(round, item, saved); preloadRound(round); return; }
  const z = zoomFor(round), w = (round.w || 256) * z, h = (round.h || 192) * z;
  const tile = (src, label, cls, n) => `<figure class="${cls}" data-n="${n || ''}"><img class="px" src="${src}" width="${w}" height="${h}" alt="${label}" draggable="false"><figcaption>${label}</figcaption></figure>`;
  const ref = tile(item.original, 'Original', 'ref');
  if (state.mode === 'grid') {
    stage.innerHTML = ref + `<div class="grid">${item.options.map((src, i) => tile(src, String(i + 1), '', i + 1)).join('')}</div>`;
  } else {
    stage.innerHTML = ref + tile(item.options[state.shown - 1], `${state.shown} of ${item.options.length}`, 'on flash', state.shown);
  }
  stage.querySelectorAll('figure[data-n]').forEach((f) => {
    if (f.dataset.n) f.addEventListener('click', () => (state.mode === 'grid' ? answer(+f.dataset.n) : answer(state.shown)));
  });
  preloadRound(round);
}

// Marking (B4): the conversion and its reference R1 side by side. Key 3 draws seams: the stroke runs along the cell
// grid from corner to corner, straight on until the pointer is most of a cell off the line, so a hand's jitter makes
// no comb; a seam is where a pair change shows and the original has none. Keys 1 and 2 paint cells: 1 something
// added inside them (blocks, noise, false contours), 2 something lost or wrong (colour, tone, detail). Answer: `cells`, 768 characters 0/1/2 row by row; `seams_v`, 24 x 31 characters 0/1
// for the vertical borders (row by row, the border right of column c); `seams_h`, 23 x 32 for the horizontal ones
// (the border below row r).
const mark = { cells: null, sv: null, sh: null, kind: 3, down: false, erase: false, at: null, peeks: 0, item: null };
const MARK_COLOUR = { 1: '#ff5a4f', 2: '#4fb6ff', seam: '#ff4fd8' };
const TURN = 0.65;                  // the stroke moves to the next grid corner when the pointer is this far past it

// One step of a seam stroke along the grid, corner (x, y) to a neighbouring corner; the picture's edge is no seam.
function step(x, y, nx, ny, value) {
  if (ny === y && y > 0 && y < 24) mark.sh[(y - 1) * 32 + Math.min(x, nx)] = value;
  if (nx === x && x > 0 && x < 32) mark.sv[Math.min(y, ny) * 31 + x - 1] = value;
}

function renderMark(round, item, saved) {
  if (mark.item !== `${round.id}__${item.id}`) {
    mark.item = `${round.id}__${item.id}`;
    mark.cells = new Uint8Array(768); mark.sv = new Uint8Array(24 * 31); mark.sh = new Uint8Array(23 * 32);
    const load = (str, arr) => { if (str) for (let i = 0; i < arr.length; i++) arr[i] = +str[i] || 0; };
    if (saved) { load(saved.cells, mark.cells); load(saved.seams_v, mark.sv); load(saved.seams_h, mark.sh); }
    mark.peeks = 0;
  }
  const z = zoomFor(round), w = 256 * z, h = 192 * z;
  $('stage').innerHTML = `
    <figure><div style="position:relative;width:${w}px;height:${h}px">
      <img class="px" src="${item.conversion}" width="${w}" height="${h}" alt="Conversion" draggable="false">
      <canvas id="marks" style="position:absolute;inset:0;width:${w}px;height:${h}px;cursor:crosshair;touch-action:none"></canvas>
    </div><figcaption id="markcap"></figcaption></figure>
    <figure class="ref"><img class="px" id="refimg" src="${item.reference}" width="${w}" height="${h}" alt="Reference" draggable="false">
      <figcaption id="refcap">Without attributes (R1) · hold Space for the original</figcaption></figure>`;
  const cv = $('marks'), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / (8 * z), (e.clientY - r.top) / (8 * z)]; };
  const cellAt = ([fx, fy]) => (fx >= 0 && fx < 32 && fy >= 0 && fy < 24 ? Math.floor(fy) * 32 + Math.floor(fx) : -1);
  const corner = ([fx, fy]) => [Math.min(32, Math.max(0, Math.round(fx))), Math.min(24, Math.max(0, Math.round(fy)))];
  const paint = (e) => {
    const p = pos(e);
    if (mark.kind !== 3) { const c = cellAt(p); if (c >= 0) mark.cells[c] = mark.erase ? 0 : mark.kind; drawMarks({ cell: c }); return; }
    let [x, y] = mark.at;                              // walk the grid toward the pointer, the longer way first
    const tx = Math.abs(p[0] - x) > TURN ? Math.round(p[0]) : x, ty = Math.abs(p[1] - y) > TURN ? Math.round(p[1]) : y;
    const cx = Math.min(32, Math.max(0, tx)), cy = Math.min(24, Math.max(0, ty));
    const v = mark.erase ? 0 : 1, horizontalFirst = Math.abs(cx - x) >= Math.abs(cy - y);
    const walkX = () => { while (x !== cx) { const nx = x + Math.sign(cx - x); step(x, y, nx, y, v); x = nx; } };
    const walkY = () => { while (y !== cy) { const ny = y + Math.sign(cy - y); step(x, y, x, ny, v); y = ny; } };
    if (horizontalFirst) { walkX(); walkY(); } else { walkY(); walkX(); }
    mark.at = [x, y];
    drawMarks({ corner: mark.at });
  };
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('pointerdown', (e) => {
    mark.down = true; mark.erase = e.button === 2 || e.shiftKey; mark.at = corner(pos(e));
    cv.setPointerCapture(e.pointerId); paint(e);
  });
  cv.addEventListener('pointermove', (e) => {
    if (mark.down) paint(e);
    else drawMarks(mark.kind === 3 ? { corner: corner(pos(e)) } : { cell: cellAt(pos(e)) });
  });
  cv.addEventListener('pointerup', () => { mark.down = false; });
  cv.addEventListener('pointerleave', () => { if (!mark.down) drawMarks(); });
  drawMarks();
}

function count(k) { let n = 0; if (mark.cells) for (const c of mark.cells) n += c === k; return n; }
function seams() { let n = 0; for (const a of [mark.sv, mark.sh]) if (a) for (const c of a) n += c; return n; }

function drawMarks(hover = null) {
  const cv = $('marks'); if (!cv) return;
  const ctx = cv.getContext('2d'), s = cv.width / 32;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const lw = Math.max(2, s / 10);
  for (let i = 0; i < 768; i++) {
    const k = mark.cells[i]; if (!k) continue;
    const x = (i % 32) * s, y = Math.floor(i / 32) * s;
    ctx.lineWidth = lw; ctx.strokeStyle = MARK_COLOUR[k]; ctx.setLineDash(k === 2 ? [s / 6, s / 8] : []);
    ctx.strokeRect(x + lw / 2, y + lw / 2, s - lw, s - lw);
  }
  ctx.setLineDash([]); ctx.lineCap = 'round'; ctx.strokeStyle = MARK_COLOUR.seam; ctx.lineWidth = Math.max(3, s / 6);
  const seg = (x0, y0, x1, y1) => { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
  for (let i = 0; i < mark.sv.length; i++) if (mark.sv[i]) { const r = Math.floor(i / 31), c = i % 31 + 1; seg(c * s, r * s + 2, c * s, (r + 1) * s - 2); }
  for (let i = 0; i < mark.sh.length; i++) if (mark.sh[i]) { const r = Math.floor(i / 32) + 1, c = i % 32; seg(c * s + 2, r * s, (c + 1) * s - 2, r * s); }
  if (hover && hover.corner) {
    ctx.fillStyle = 'rgba(232,197,71,.9)';
    ctx.beginPath(); ctx.arc(hover.corner[0] * s, hover.corner[1] * s, Math.max(3, s / 7), 0, 2 * Math.PI); ctx.fill();
  } else if (hover && hover.cell >= 0 && !mark.down) {
    ctx.strokeStyle = 'rgba(232,197,71,.8)'; ctx.lineWidth = 1;
    ctx.strokeRect((hover.cell % 32) * s + .5, Math.floor(hover.cell / 32) * s + .5, s - 1, s - 1);
  }
  const cap = $('markcap');
  const mode = { 1: 'cells, 1 added', 2: 'cells, 2 lost or wrong', 3: 'seams, 3' }[mark.kind];
  if (cap) cap.textContent = `Conversion · drawing ${mode} · ${seams()} seam segments, ${count(1)} added, ${count(2)} lost`;
}

function markKey(e, round) {
  const item = round.items[state.index];
  if (e.key === 'Backspace') { e.preventDefault(); if (state.index > 0) { state.index -= 1; startItem(); } return; }
  if (!item || $('stage').hidden) return;
  if (e.key === '1' || e.key === '2' || e.key === '3') { mark.kind = +e.key; drawMarks(); return; }
  if (e.key === ' ') {
    e.preventDefault();
    if (!e.repeat) { mark.peeks += 1; $('refimg').src = item.original; $('refcap').textContent = 'Original · release Space for R1'; }
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); submitMarks(round, item); }
}

document.addEventListener('keyup', (e) => {
  const round = currentRound(), item = round && round.items[state.index];
  if (e.key === ' ' && round && round.task === 'mark' && item && $('refimg')) {
    $('refimg').src = item.reference; $('refcap').textContent = 'Without attributes (R1) · hold Space for the original';
  }
});

function submitMarks(round, item) {
  const extra = { cells: Array.from(mark.cells).join(''), seams_v: Array.from(mark.sv).join(''),
    seams_h: Array.from(mark.sh).join(''), n_seams: seams(), n_added: count(1), n_lost: count(2), peeks: mark.peeks };
  mark.item = null;
  answer(null, extra);
}

function block(text) {
  $('stage').hidden = true; const n = $('notice'); n.hidden = false; n.className = 'notice warn'; n.textContent = text;
}

// Decoded ahead, so the next item paints with no wait. Kept for the whole round (a few dozen small PNGs).
const warm = {};
function preload(item) {
  if (!item) return;
  [item.original, ...(item.options || []), item.conversion, item.reference].filter(Boolean).forEach((s) => {
    if (warm[s]) return;
    const i = new Image(); i.src = s; warm[s] = i; i.decode().catch(() => {});
  });
}
function preloadRound(round) { if (round) round.items.slice(state.index, state.index + 4).forEach(preload); }

function startItem() { state.t0 = performance.now(); state.flips = 0; state.shown = 1; render(); }

// The next item shows at once; the write runs behind it. A failed write takes the answer back and says so.
function answer(pick, extra) {
  const round = currentRound(), item = round && round.items[state.index];
  if (!item || !state.db || $('stage').hidden) return;
  const vote = {
    round: round.id, item: item.id, pick, ms: Math.round(performance.now() - state.t0), mode: state.mode,
    flips: state.flips, zoom: zoomFor(round), dpr: window.devicePixelRatio || 1,
    win: [window.innerWidth, window.innerHeight], at: new Date().toISOString(), ...(extra || {}),
  };
  const id = `${round.id}__${item.id}`;
  state.votes[id] = vote;
  state.pending += 1; showSaving();
  state.index = nextIndex(round, state.index + 1);
  startItem();
  const write = (state.writes[id] || Promise.resolve()).then(() => state.db.collection('votes').doc(id).set(vote));
  state.writes[id] = write.catch(() => {});
  write.then(() => { state.pending -= 1; showSaving(); }, (e) => {
    state.pending -= 1; delete state.votes[id]; state.failed += 1; showSaving(e && e.code);
    if (round.id === state.roundId) { state.index = nextIndex(round, 0); startItem(); }
  });
}

function showSaving(code) {
  const el = $('saving');
  el.className = state.failed ? 'warn' : 'meta';
  el.textContent = state.failed
    ? `${state.failed} answer${state.failed > 1 ? 's' : ''} not saved (${code || 'error'}): shown again`
    : state.pending ? 'saving…' : 'saved';
}

function nextIndex(round, from) {
  for (let i = from; i < round.items.length; i++) if (!state.votes[`${round.id}__${round.items[i].id}`]) return i;
  return round.items.length;
}

function selectRound(id) {
  state.roundId = id; const round = currentRound();
  state.index = round ? nextIndex(round, 0) : 0; startItem();
}

function fillRounds() {
  const sel = $('round'), ids = Object.keys(state.rounds).sort((a, b) => (state.rounds[b].created || '').localeCompare(state.rounds[a].created || ''));
  sel.innerHTML = ids.map((id) => {
    const r = state.rounds[id], left = itemsLeft(r).length;
    return `<option value="${id}">${r.title || id}${left ? ` (${left} left)` : ' (done)'}</option>`;
  }).join('');
  if (!state.roundId || !state.rounds[state.roundId]) {
    const open = ids.find((id) => itemsLeft(state.rounds[id]).length) || ids[0];
    if (open) selectRound(open); else render();
  }
  if (state.roundId) sel.value = state.roundId;
}

document.addEventListener('keydown', (e) => {
  const round = currentRound(); if (!round) return;
  if (round.task === 'mark') { markKey(e, round); return; }
  const item = round.items[state.index];
  if (e.key === 'Tab') { e.preventDefault(); state.mode = state.mode === 'grid' ? 'flip' : 'grid'; try { localStorage.setItem('mode', state.mode); } catch (_) {} render(); return; }
  if (e.key === 'Backspace') {
    e.preventDefault();
    if (state.index > 0) { state.index -= 1; startItem(); }   // shows the last item again; a new answer replaces the saved one
    return;
  }
  if (!item || $('stage').hidden) return;   // no answers while a warning hides the pictures
  if (e.key === '0') { answer(0); return; }
  const n = Number(e.key);
  if (n >= 1 && n <= item.options.length) {
    if (state.mode === 'grid') answer(n);
    else if (n !== state.shown) { state.shown = n; state.flips += 1; render(); }
    return;
  }
  if (e.key === 'Enter' && state.mode === 'flip') answer(state.shown);
});
$('mode').addEventListener('click', () => { state.mode = state.mode === 'grid' ? 'flip' : 'grid'; render(); });
$('round').addEventListener('change', (e) => selectRound(e.target.value));
window.addEventListener('resize', () => render());
try { if (localStorage.getItem('mode') === 'flip') state.mode = 'flip'; } catch (_) {}

(async () => {
  const db = await window.claude?.use?.('db');
  if (!db) { $('notice').textContent = 'Answers cannot be saved in this view. Open the page signed in to claude.ai.'; return; }
  state.db = db;
  db.collection('rounds').onSnapshot((snap) => {
    state.rounds = {};
    snap.docs.forEach((d) => { const r = d.data(); if (r && r.status !== 'hidden') state.rounds[d.id] = { ...r, id: d.id }; });
    fillRounds();
  }, () => { $('notice').textContent = 'The rounds could not be loaded. Reload the page.'; });
  db.collection('votes').onSnapshot((snap) => {
    snap.docs.forEach((d) => { state.votes[d.id] = d.data(); });
    fillRounds();
    const round = currentRound(); if (round && !round.items[state.index]) render();
  }, () => {});
})();
</script>
