name: test

on:
  push:
    paths-ignore: ['**.md', 'notebooks/**']
  pull_request:   # every PR, docs too: the checks it requires must report
  workflow_dispatch:

concurrency:   # a newer push to the same ref cancels the running tests
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # code=false when a PR touches only the push trigger's paths-ignore files.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > files
            grep -qvE '\.md$|^notebooks/' files || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Docs-only PRs: report the required test checks without running them.
  test-docs-only:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    name: test (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only change, nothing to test"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: setup.cfg

      - run: uv pip install -e . pytest

      - name: Long paths off, as on most Windows machines
        if: runner.os == 'Windows'   # the runner image turns them on; off, a path past MAX_PATH (260) opens only with the \\?\ prefix
        shell: pwsh
        run: Set-ItemProperty -Path HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem -Name LongPathsEnabled -Value 0

      - run: pytest -v

      - name: UI tests under the Dear ImGui test engine
        if: runner.os == 'Linux'   # a virtual display and Mesa's software OpenGL
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1 libglx-mesa0 libegl1
          xvfb-run -a python tests/test_ui.py
