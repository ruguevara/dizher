name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'notebooks/**']
  pull_request:
    paths-ignore: ['**.md', 'notebooks/**']
  workflow_dispatch:

concurrency:   # a newer push to the same ref cancels the running build
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, name: macos-arm64}   # no Intel Mac: imgui-bundle has no x86_64 macOS wheels
          - {os: windows-latest, name: windows-x64}
          - {os: ubuntu-22.04, name: linux-x64}   # the older glibc runs on more distros
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: setup.cfg

      - run: uv pip install -e . pyinstaller
      - run: ./packaging/build.sh
        env:
          DIZHER_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}   # a tag is a release, the rest dev builds

      - name: Archive
        run: |
          out="Dizher-${{ matrix.name }}"
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent dist/Dizher.app "$out.zip" ;;   # keeps the bundle's symlinks
            Windows) (cd dist && 7z a -bd "../$out.zip" Dizher) ;;
            Linux)   tar -C dist -czf "$out.tar.gz" Dizher ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Dizher-${{ matrix.name }}
          path: Dizher-${{ matrix.name }}.*
          compression-level: 0   # already compressed
          retention-days: 14

  release:   # a v* tag publishes the three archives as a GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - run: |   # v0.2.1-alpha and the like are pre-releases
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease) Dizher-*
        env:
          GH_TOKEN: ${{ github.token }}
